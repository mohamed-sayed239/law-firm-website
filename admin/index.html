<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | مكتب عمرو عبدالحكيم</title>
  <meta name="robots" content="noindex, nofollow, noarchive">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">

  <style>
    /* ===== Admin Dashboard Specific Styles ===== */
    body {
      display: flex;
      background: var(--color-background);
      font-family: var(--font-main);
      margin: 0;
      min-height: 100vh;
    }

    /* Sidebar */
    .admin-sidebar {
      width: 260px;
      background: var(--color-primary);
      color: var(--color-white);
      height: 100vh;
      position: sticky;
      top: 0;
      padding: var(--spacing-lg) var(--spacing-md);
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
      overflow-y: auto;
      transition: transform var(--transition-base);
      z-index: 100;
    }

    .admin-sidebar .sidebar-brand {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-xl);
      padding-bottom: var(--spacing-md);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .admin-sidebar .sidebar-brand img {
      height: 40px;
      width: auto;
      filter: brightness(0) invert(1);
    }

    .admin-sidebar .sidebar-brand span {
      font-size: 1.2rem;
      font-weight: var(--font-weight-bold);
      color: var(--color-white);
    }

    .admin-sidebar .sidebar-nav {
      flex: 1;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .admin-sidebar .sidebar-nav li {
      margin-bottom: 4px;
    }

    .admin-sidebar .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: 0.7rem 1rem;
      border-radius: var(--radius-sm);
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-weight: var(--font-weight-medium);
      transition: all var(--transition-fast);
      font-size: 0.95rem;
    }

    .admin-sidebar .sidebar-nav a:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--color-white);
    }

    .admin-sidebar .sidebar-nav a.active {
      background: var(--color-accent);
      color: var(--color-white);
      box-shadow: 0 2px 8px rgba(176, 141, 87, 0.2);
    }

    .admin-sidebar .sidebar-nav a svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      flex-shrink: 0;
    }

    .admin-sidebar .sidebar-logout {
      margin-top: auto;
      padding-top: var(--spacing-md);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .admin-sidebar .sidebar-logout button {
      width: 100%;
      padding: 0.7rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: var(--font-weight-medium);
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      justify-content: center;
    }

    .admin-sidebar .sidebar-logout button:hover {
      background: #dc3545;
      border-color: #dc3545;
      color: var(--color-white);
    }

    /* Main Content */
    .admin-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .admin-topbar {
      background: var(--color-surface);
      padding: var(--spacing-md) var(--spacing-lg);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.92);
    }

    .admin-topbar .topbar-left {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    .admin-topbar .topbar-left h1 {
      font-size: 1.4rem;
      margin: 0;
      font-weight: var(--font-weight-bold);
      color: var(--color-primary);
    }

    .admin-topbar .topbar-right {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    .admin-topbar .topbar-right .user-email {
      font-size: 0.9rem;
      color: var(--color-muted);
    }

    .admin-topbar .topbar-right .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--color-primary);
      cursor: pointer;
      padding: 4px;
    }

    .admin-topbar .topbar-right .mobile-toggle svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    /* Dashboard Content */
    .dashboard-content {
      padding: var(--spacing-lg);
      flex: 1;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-xl);
    }

    .stat-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-base);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--color-accent);
    }

    .stat-card .stat-label {
      font-size: 0.85rem;
      color: var(--color-muted);
      font-weight: var(--font-weight-medium);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card .stat-number {
      font-size: 2rem;
      font-weight: var(--font-weight-extrabold);
      color: var(--color-primary);
      margin-top: var(--spacing-xs);
    }

    .stat-card .stat-number.loading {
      color: var(--color-muted);
      opacity: 0.5;
    }

    .recent-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-lg);
    }

    .recent-section {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      box-shadow: var(--shadow-sm);
    }

    .recent-section h3 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: var(--spacing-md);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .recent-section h3 a {
      font-size: 0.85rem;
      font-weight: var(--font-weight-medium);
      color: var(--color-accent);
      text-decoration: none;
    }

    .recent-section h3 a:hover {
      text-decoration: underline;
    }

    .recent-item {
      padding: var(--spacing-sm) 0;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .recent-item:last-child {
      border-bottom: none;
    }

    .recent-item .item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .recent-item .item-name {
      font-weight: var(--font-weight-semibold);
      color: var(--color-text);
    }

    .recent-item .item-meta {
      font-size: 0.8rem;
      color: var(--color-muted);
    }

    .recent-item .item-status {
      font-size: 0.7rem;
      font-weight: var(--font-weight-semibold);
      padding: 0.2rem 0.6rem;
      border-radius: 40px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .item-status.status-new {
      background: #fef3c7;
      color: #92400e;
    }

    .item-status.status-read {
      background: #e5e7eb;
      color: #374151;
    }

    .item-status.status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .item-status.status-approved {
      background: #d1fae5;
      color: #065f46;
    }

    .item-status.status-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .empty-state-small {
      text-align: center;
      color: var(--color-muted);
      padding: var(--spacing-md);
      font-size: 0.95rem;
    }

    /* Mobile Drawer */
    .mobile-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 90;
      opacity: 0;
      transition: opacity var(--transition-base);
    }

    .mobile-backdrop.open {
      opacity: 1;
    }

    @media (max-width: 992px) {
      .admin-sidebar {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        transform: translateX(100%);
        box-shadow: var(--shadow-xl);
        width: 280px;
        z-index: 100;
      }

      .admin-sidebar.open {
        transform: translateX(0);
      }

      .mobile-backdrop.open {
        display: block;
      }

      .admin-topbar .topbar-right .mobile-toggle {
        display: block;
      }

      .recent-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 576px) {
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
      .dashboard-content {
        padding: var(--spacing-md);
      }
      .admin-topbar {
        padding: var(--spacing-sm) var(--spacing-md);
      }
      .admin-topbar .topbar-left h1 {
        font-size: 1.1rem;
      }
      .admin-topbar .topbar-right .user-email {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- Mobile Backdrop -->
  <div class="mobile-backdrop" id="sidebarBackdrop"></div>

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar" aria-label="القائمة الجانبية">
    <div class="sidebar-brand">
      <img src="../assets/logo/logo.png" alt="مكتب عمرو عبدالحكيم" onerror="this.style.display='none'; this.nextElementSibling?.style?.display='inline';">
      <span>المكتب</span>
    </div>

    <nav>
      <ul class="sidebar-nav">
        <li>
          <a href="index.html" class="active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12l9-9 9 9"/><path d="M9 22V12h6v10"/></svg>
            لوحة التحكم
          </a>
        </li>
        <li>
          <a href="services.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v16H4z"/><path d="M4 9h16"/><path d="M9 4v16"/></svg>
            الخدمات
          </a>
        </li>
        <li>
          <a href="lawyers.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            فريق العمل
          </a>
        </li>
        <li>
          <a href="articles.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            المقالات
          </a>
        </li>
        <li>
          <a href="messages.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            الرسائل
          </a>
        </li>
        <li>
          <a href="consultations.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            الاستشارات
          </a>
        </li>
        <li>
          <a href="settings.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>
            الإعدادات
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-logout">
      <button id="adminLogoutBtn" aria-label="تسجيل الخروج">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        تسجيل الخروج
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <!-- Topbar -->
    <header class="admin-topbar">
      <div class="topbar-left">
        <h1 id="pageTitle">لوحة التحكم</h1>
      </div>
      <div class="topbar-right">
        <span class="user-email" id="adminUserEmail">loading...</span>
        <button class="mobile-toggle" id="sidebarToggle" aria-label="فتح القائمة الجانبية">

    <!-- Dashboard Content -->
    <div class="dashboard-content">
      <!-- Stats Cards -->
      <section class="stats-grid" aria-label="إحصائيات سريعة">
        <div class="stat-card">
          <div class="stat-label">الخدمات</div>
          <div class="stat-number" id="total-services">...</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">فريق العمل</div>
          <div class="stat-number" id="total-lawyers">...</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">المقالات</div>
          <div class="stat-number" id="total-articles">...</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">رسائل جديدة</div>
          <div class="stat-number" id="new-messages">...</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">استشارات جديدة</div>
          <div class="stat-number" id="new-consultations">...</div>
        </div>
      </section>

      <!-- Recent Items -->
      <section class="recent-grid">
        <!-- Recent Messages -->
        <div class="recent-section">
          <h3>
            آخر الرسائل
            <a href="messages.html">عرض الكل</a>
          </h3>
          <div id="recent-messages">
            <div class="empty-state-small">جاري التحميل...</div>
          </div>
        </div>

        <!-- Recent Consultations -->
        <div class="recent-section">
          <h3>
            آخر طلبات الاستشارة
            <a href="consultations.html">عرض الكل</a>
          </h3>
          <div id="recent-consultations">
            <div class="empty-state-small">جاري التحميل...</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Scripts -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
      }
    }
  </script>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
